<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Livre AR - Maurice</title>
  <link rel="icon" href="data:,">

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      position: fixed;
    }

    a-scene {
      width: 100% !important;
      height: 100% !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    #start-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #start-overlay h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    #start-overlay p {
      font-size: 14px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    #start-button {
      background: white;
      color: #667eea;
      border: none;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }

    #start-button:active {
      transform: scale(0.95);
    }

    #debug-info {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 10px;
      z-index: 1001;
      max-width: 200px;
    }

    #instructions {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 1000;
      text-align: center;
      max-width: 85%;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    #loading {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 10px;
      z-index: 1001;
      backdrop-filter: blur(10px);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- Écran de démarrage -->
  <div id="start-overlay">
    <h1>📚 Livre AR Maurice</h1>
    <p>Pointez votre caméra sur les images du livre<br>pour découvrir les vidéos interactives</p>
    <button id="start-button">Démarrer l'expérience</button>
    <div id="platform-info" style="margin-top: 20px; font-size: 11px; opacity: 0.7;"></div>
  </div>

  <div id="debug-info"></div>
  <div id="loading" class="hidden">Chargement...</div>
  <div id="instructions" class="hidden">📸 Pointez sur une image du livre</div>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.01; warmupTolerance: 2; missTolerance: 10; autoStart: false;"
    renderer="colorManagement: false; antialias: true; alpha: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>

    <a-assets>
      <video
        id="vid0"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto">
      </video>

      <video
        id="vid1"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto">
      </video>

      <video
        id="vid2"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto">
      </video>

      <video
        id="vid3"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto">
      </video>

      <video
        id="vid4"
        crossorigin="anonymous"
        playsinline
        webkit-playsinline
        loop
        muted
        preload="auto">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Target 0: MONTAGNE DU REMPART -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        src="#vid0"
        width="1"
        height="0.552"
        position="0 0 0"
        rotation="0 0 0"
        material="side: double"
        yuv-fix>
      </a-plane>
    </a-entity>

    <!-- Target 1: LES SALINES TOP SHOT -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-plane
        src="#vid1"
        width="1"
        height="0.552"
        position="0 0 0"
        rotation="0 0 0"
        material="side: double"
        yuv-fix>
      </a-plane>
    </a-entity>

    <!-- Target 2: CASCADE SAUVAGE -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-plane
        src="#vid2"
        width="1"
        height="0.552"
        position="0 0 0"
        rotation="0 0 0"
        material="side: double"
        yuv-fix>
      </a-plane>
    </a-entity>

    <!-- Target 3: PIETTER BOTH -->
    <a-entity mindar-image-target="targetIndex: 3">
      <a-plane
        src="#vid3"
        width="1"
        height="0.552"
        position="0 0 0"
        rotation="0 0 0"
        material="side: double"
        yuv-fix>
      </a-plane>
    </a-entity>

    <!-- Target 4: Séquence 5 -->
    <a-entity mindar-image-target="targetIndex: 4">
      <a-plane
        src="#vid4"
        width="1"
        height="0.552"
        position="0 0 0"
        rotation="0 0 0"
        material="side: double"
        yuv-fix>
      </a-plane>
    </a-entity>
  </a-scene>

  <script>
    // === DÉTECTION PLATEFORME ===
    const isSafariIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|CriOS|FxiOS/.test(navigator.userAgent);
    const isAndroid = /Android/.test(navigator.userAgent);
    const isChrome = /Chrome/.test(navigator.userAgent);

    const platform = isSafariIOS ? 'Safari iOS' : (isAndroid ? 'Android' : 'Autre');
    console.log(`📱 Plateforme détectée: ${platform}`);

    document.getElementById('platform-info').textContent = `Plateforme: ${platform}`;

    // === DEBUG INFO ===
    function updateDebugInfo(text) {
      const debugEl = document.getElementById('debug-info');
      debugEl.innerHTML = text;
      console.log('DEBUG:', text);
    }

    updateDebugInfo('En attente du démarrage...');

    // === COMPOSANT A-FRAME POUR FIX SAFARI iOS YUV ===
    AFRAME.registerComponent('yuv-fix', {
      schema: {
        enabled: {type: 'boolean', default: true}
      },

      init: function() {
        this.applied = false;
        this.attempts = 0;
        this.maxAttempts = 150;

        console.log('[yuv-fix] Composant initialisé');
      },

      tick: function() {
        // Uniquement pour Safari iOS
        if (!isSafariIOS) return;

        if (!this.applied && this.attempts < this.maxAttempts) {
          this.attempts++;
          this.tryApplyFix();
        }
      },

      tryApplyFix: function() {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh) return;

        const material = mesh.material;
        if (!material) return;

        const videoElement = document.querySelector(this.el.getAttribute('src'));
        if (!videoElement) return;

        let videoTexture = material.map;
        if (!videoTexture || !videoTexture.image) {
          videoTexture = new THREE.VideoTexture(videoElement);
          videoTexture.minFilter = THREE.LinearFilter;
          videoTexture.magFilter = THREE.LinearFilter;
          videoTexture.format = THREE.RGBFormat;
        }

        this.applyShader(mesh, videoTexture);
      },

      applyShader: function(mesh, videoTexture) {
        if (this.applied) return;

        console.log('🔧 [yuv-fix] Application du shader BGR pour Safari iOS...');

        const customMaterial = new THREE.ShaderMaterial({
          uniforms: {
            videoTexture: { value: videoTexture }
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform sampler2D videoTexture;
            varying vec2 vUv;

            void main() {
              // Fix Safari iOS: WebKit fournit BGR au lieu de RGB
              // Swap manuel des canaux R et B
              vec4 color = texture2D(videoTexture, vUv);
              gl_FragColor = vec4(color.b, color.g, color.r, color.a);
            }
          `,
          side: THREE.DoubleSide,
          transparent: false
        });

        mesh.material = customMaterial;
        this.applied = true;

        console.log('✅ [yuv-fix] Shader BGR Safari iOS appliqué');
        updateDebugInfo('Shader: ✓ (BGR fix)');
      }
    });

    // === CONFIGURATION VIDÉOS ===
    const videoConfigs = [
      { id: 'vid0', url: 'https://customer-00y5dtvdulpki0l5.cloudflarestream.com/9a42e2ea5a38a25012d90f1816cad32f/manifest/video.m3u8' },
      { id: 'vid1', url: 'https://customer-00y5dtvdulpki0l5.cloudflarestream.com/fd57736b9afe3a2c2b939d4206536894/manifest/video.m3u8' },
      { id: 'vid2', url: 'https://customer-00y5dtvdulpki0l5.cloudflarestream.com/cd268be7086f84fc80cfbc29c5965592/manifest/video.m3u8' },
      { id: 'vid3', url: 'https://customer-00y5dtvdulpki0l5.cloudflarestream.com/0701376f8124bd8f489450d7375310c6/manifest/video.m3u8' },
      { id: 'vid4', url: 'https://customer-00y5dtvdulpki0l5.cloudflarestream.com/d5366edf44b4fdf95c300b206c89e76b/manifest/video.m3u8' }
    ];

    const instructions = document.getElementById('instructions');
    const loading = document.getElementById('loading');
    const videos = [];
    let videosLoaded = 0;
    let arStarted = false;

    function setupVideo(config) {
      const videoElement = document.getElementById(config.id);
      videos.push(videoElement);

      if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
        console.log(`[${config.id}] HLS natif Safari iOS`);
        videoElement.src = config.url;

        videoElement.addEventListener('loadedmetadata', () => {
          console.log(`✓ [${config.id}] OK`);
          videosLoaded++;
          updateLoadingStatus();
        });

      } else if (Hls.isSupported()) {
        console.log(`[${config.id}] HLS.js`);
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: false,
          backBufferLength: 90,
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          startLevel: -1
        });

        hls.loadSource(config.url);
        hls.attachMedia(videoElement);

        hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
          console.log(`✓ [${config.id}] OK (${data.levels.length} qualités)`);
          videosLoaded++;
          updateLoadingStatus();
        });

        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            console.error(`✗ [${config.id}] Erreur:`, data.details);
          }
        });

      } else {
        console.warn(`✗ [${config.id}] HLS non supporté`);
        videosLoaded++;
        updateLoadingStatus();
      }
    }

    function updateLoadingStatus() {
      loading.textContent = `Vidéos: ${videosLoaded}/5`;
      updateDebugInfo(`Vidéos: ${videosLoaded}/5<br>AR: ${arStarted ? '✓' : '...'}`);

      if (videosLoaded >= 5) {
        setTimeout(() => {
          loading.classList.add('hidden');
        }, 2000);
      }
    }

    // === DÉMARRAGE MANUEL ===
    document.getElementById('start-button').addEventListener('click', async () => {
      console.log('🚀 Démarrage de l\'expérience AR...');
      updateDebugInfo('Démarrage AR...');

      try {
        // Demander l'accès caméra explicitement
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' },
          audio: false
        });
        console.log('✓ Caméra autorisée');
        updateDebugInfo('Caméra: ✓<br>Chargement...');

        // Arrêter le stream temporaire (MindAR va créer le sien)
        stream.getTracks().forEach(track => track.stop());

        // Masquer l'overlay
        document.getElementById('start-overlay').classList.add('hidden');
        instructions.classList.remove('hidden');
        loading.classList.remove('hidden');

        // Charger les vidéos
        videoConfigs.forEach(config => setupVideo(config));

        // Démarrer MindAR
        const sceneEl = document.querySelector('a-scene');

        // Fonction pour démarrer l'AR
        const startAR = () => {
          console.log('✓ Démarrage de MindAR...');
          updateDebugInfo('Démarrage MindAR...');

          // Démarrer MindAR manuellement
          const mindARSystem = sceneEl.systems['mindar-image-system'];
          if (mindARSystem) {
            try {
              mindARSystem.start();
              console.log('✓ MindAR démarré');
              arStarted = true;
              updateDebugInfo(`Vidéos: ${videosLoaded}/5<br>AR: ✓<br>Plateforme: ${platform}`);

              // FIX: Forcer le redimensionnement du canvas après démarrage
              setTimeout(() => {
                const canvas = document.querySelector('canvas');
                if (canvas) {
                  canvas.style.width = '100%';
                  canvas.style.height = '100%';
                  canvas.style.position = 'fixed';
                  canvas.style.top = '0';
                  canvas.style.left = '0';
                  console.log('✓ Canvas redimensionné');
                }

                // Forcer le resize de la scène A-Frame
                sceneEl.resize();
                window.dispatchEvent(new Event('resize'));
              }, 500);
            } catch (err) {
              console.error('✗ Erreur MindAR:', err);
              updateDebugInfo('Erreur MindAR:<br>' + err.message);
            }
          } else {
            console.error('✗ MindAR system introuvable');
            updateDebugInfo('Erreur: MindAR non trouvé');
          }

          // Gestion des targets
          const targets = document.querySelectorAll('[mindar-image-target]');

          targets.forEach((target, index) => {
            target.addEventListener('targetFound', () => {
              console.log(`🎯 Target ${index} détectée`);
              instructions.textContent = `✅ Lecture de la vidéo ${index + 1}`;
              instructions.style.background = 'rgba(0, 200, 0, 0.85)';

              const video = videos[index];
              if (video) {
                video.play().then(() => {
                  console.log(`▶ Vidéo ${index} en lecture`);
                }).catch(err => {
                  console.error(`✗ Erreur lecture: ${err.message}`);
                  video.muted = true;
                  video.play();
                });
              }
            });

            target.addEventListener('targetLost', () => {
              console.log(`Target ${index} perdue`);
              instructions.textContent = '📸 Pointez sur une image du livre';
              instructions.style.background = 'rgba(0, 0, 0, 0.85)';

              const video = videos[index];
              if (video) {
                video.pause();
                video.currentTime = 0;
              }
            });
          });
        };

        // Si la scène est déjà chargée, démarrer immédiatement
        if (sceneEl.hasLoaded) {
          console.log('✓ Scène déjà chargée');
          startAR();
        } else {
          // Sinon, attendre qu'elle charge
          sceneEl.addEventListener('loaded', () => {
            console.log('✓ Scène A-Frame prête');
            startAR();
          });
        }

      } catch (error) {
        console.error('✗ Erreur accès caméra:', error);
        alert(`Erreur: Impossible d'accéder à la caméra.\n\n${error.message}\n\nVeuillez autoriser l'accès à la caméra dans les paramètres de votre navigateur.`);
        updateDebugInfo('Erreur caméra:<br>' + error.message);
      }
    });

    // === GESTION REDIMENSIONNEMENT ===
    window.addEventListener('resize', () => {
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl && arStarted) {
        sceneEl.resize();
        const canvas = document.querySelector('canvas');
        if (canvas) {
          canvas.style.width = '100%';
          canvas.style.height = '100%';
        }
        console.log('↔ Écran redimensionné');
      }
    });

    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        window.dispatchEvent(new Event('resize'));
      }, 200);
    });

    window.addEventListener('error', (e) => {
      console.error('⚠ Erreur globale:', e.message);
      updateDebugInfo('Erreur: ' + e.message);
    });
  </script>
</body>
</html>
